<!DOCTYPE html>
<html lang="ja" data-ui="foster">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おかね</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&family=M+PLUS+Rounded+1c:wght@400;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/ui/tokens.css">
  <link rel="stylesheet" href="/ui/atoms.css">
  <link rel="stylesheet" href="/ui/molecules.css">
  <link rel="stylesheet" href="/ui/pages.css">
  <script src="/ui/page.js"></script>
  <style>
    /* おかね(API 代)。2026-11-19 作り直し: 日 / 週 / 月(予算の周期)を切り替えて、
       その期間の合計・前の期間との差・だれが何回(会話 / ひとりの時間 / ほか)・1 回あたり・棒グラフ。予算のペースはいつも上に */
    .c-bar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 10px; }
    .c-nav { display: flex; align-items: center; gap: 4px; margin-left: auto; }
    .c-nav .lbl { min-width: 8.5em; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
    .c-hero { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
    .c-hero .v { font-family: var(--ui-font-head); font-size: 2.2rem; font-weight: 700; color: var(--ui-text); font-variant-numeric: tabular-nums; }
    .c-hero .s { font-size: var(--ui-fs-s); color: var(--ui-text-sub); line-height: 1.6; font-variant-numeric: tabular-nums; }
    .c-up { color: var(--ui-danger); } .c-down { color: var(--ui-ok, #4c9a6a); }
    /* 予算: 使った分の棒と、いまの目安の印 */
    .c-track { position: relative; height: 16px; margin: 8px 0 4px; background: var(--ui-surface-soft); border: var(--ui-line-w) solid var(--ui-line-soft); border-radius: 999px; }
    .c-fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px 4px 4px 999px; }
    .c-mark { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--ui-text); border-radius: 2px; }
    .c-marklbl { position: absolute; top: 20px; transform: translateX(-50%); font-size: 0.7rem; color: var(--ui-text-sub); white-space: nowrap; }
    .c-budget-text { margin-top: 22px; font-size: 0.92rem; line-height: 1.8; color: var(--ui-text); font-variant-numeric: tabular-nums; }
    .c-state { display: inline-block; padding: 1px 10px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; }
    .c-state.ok { background: color-mix(in srgb, var(--ui-ok, #4c9a6a) 16%, transparent); color: var(--ui-ok, #4c9a6a); }
    .c-state.warn { background: color-mix(in srgb, #B8860B 16%, transparent); color: #8a6508; }
    .c-state.bad { background: var(--ui-danger-soft); color: var(--ui-danger); }
    /* だれが・何に: 表 */
    .c-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
    .c-table th, .c-table td { padding: 7px 4px; border-bottom: 1px solid var(--ui-line-soft); text-align: right; vertical-align: top; }
    .c-table th { font-size: 0.75rem; font-weight: 700; color: var(--ui-text-sub); }
    .c-table th:first-child, .c-table td:first-child { text-align: left; white-space: nowrap; }
    .c-table tfoot td { font-weight: 700; border-bottom: 0; }
    .c-table .m { display: block; color: var(--ui-text); }
    .c-table .n { display: block; font-size: 0.72rem; color: var(--ui-text-mute); white-space: nowrap; }
    .c-dot { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 50%; vertical-align: -1px; box-shadow: 0 0 0 1px rgba(0,0,0,.12); }
    .c-scroll { overflow-x: auto; }
    /* 棒グラフ: 1 色。目安の線は点線 */
    .c-chart { position: relative; }
    .c-chart svg { display: block; width: 100%; height: 180px; overflow: visible; }
    .c-chart .bar { fill: var(--ui-accent-text); }
    .c-chart .bar.is-sel { fill: var(--ui-heading); }
    .c-chart .hit { fill: transparent; cursor: pointer; }
    .c-chart .hit:hover + .bar, .c-chart .bar.is-hover { opacity: .75; }
    .c-chart .goal { stroke: var(--ui-text-sub); stroke-width: 1; stroke-dasharray: 4 3; }
    .c-chart .axis { font-size: 10px; fill: var(--ui-text-mute); }
    .c-chart .base { stroke: var(--ui-line-soft); stroke-width: 1; }
    .c-tip { position: absolute; z-index: 2; pointer-events: none; padding: 6px 10px; font-size: 0.78rem; line-height: 1.6; background: var(--ui-surface); border: 1px solid var(--ui-line-soft); border-radius: 8px; box-shadow: var(--ui-shadow-pop); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .c-legend { margin-top: 4px; font-size: 0.72rem; color: var(--ui-text-sub); }
    /* その日の 1 回ずつ */
    .c-run { display: grid; grid-template-columns: 3.2em 1fr auto; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--ui-line-soft); font-size: 0.86rem; font-variant-numeric: tabular-nums; }
    .c-run .t { color: var(--ui-text-sub); }
    .c-run .k { color: var(--ui-text-sub); font-size: 0.78rem; }
    .c-hint { font-size: 0.75rem; color: var(--ui-text-mute); line-height: 1.6; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="p-wrap">
    <div class="p-head"><a class="a-btn a-btn--sub a-btn--s" href="/">← もどる</a><h1>💰 おかね</h1></div>
    <div id="main"></div>
    <div class="p-empty" id="empty">読み込み中…</div>
  </div>
  <script>
    const { esc } = PetitPage;
    const KIND = { chat: "会話", autonomous: "ひとりの時間" };   // それ以外(日記・ボタン・体のひとこと…)は「ほか」
    const OTHER_LABELS = { diary: "日記", button: "ボタン", display_phrase: "体のひとこと", sensor: "体のセンサー", camera: "体のカメラ", mic: "体のマイク" };
    const kindOf = s => KIND[s] ? s : "other";
    const money = v => "$" + Number(v || 0).toFixed(2);
    const money3 = v => v < 1 ? "$" + Number(v || 0).toFixed(3) : money(v);   // 1 回あたり・1 回ずつは小さいので 3 桁
    const WD = "日月火水木金土";
    const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
    const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
    const md = s => { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
    const mdw = s => `${md(s)}(${WD[parse(s).getDay()]})`;
    const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);

    let S = { view: "day", date: "", base: null, rows: [], chars: [], runs: {} };
    try { S.view = localStorage.getItem("costs.view") || "day"; } catch (e) {}

    const nameOf = id => id ? ((S.chars.find(c => c.id === id) || {}).name || id) : "家(日記など)";
    const colorOf = id => (S.chars.find(c => c.id === id) || {}).color || "#cfc6bb";

    // 予算の周期(reset 日〜次の reset 日の前の日)。base.cycle_start / cycle_end は今の周期
    function cycleOf(date) {
      const reset = Number(S.base.cycle_start.slice(8, 10));
      const d = parse(date);
      let s = new Date(d.getFullYear(), d.getMonth(), reset);
      if (d.getDate() < reset) s = new Date(d.getFullYear(), d.getMonth() - 1, reset);
      const e = new Date(s.getFullYear(), s.getMonth() + 1, reset);
      e.setDate(e.getDate() - 1);
      return [iso(s), iso(e)];
    }
    function rangeOf(view, date) {
      if (view === "day") return [date, date];
      if (view === "week") return [addDays(date, -6), date];
      return cycleOf(date);
    }
    function sum(from, to) {
      const out = { total: 0, n: 0, by: {} };   // by[char][kind] = {n, cost}
      for (const r of S.rows) {
        if (r.date < from || r.date > to) continue;
        const k = kindOf(r.source);
        const c = (out.by[r.character] ||= {});
        const x = (c[k] ||= { n: 0, cost: 0, src: {} });
        x.n += r.n; x.cost += r.cost; x.src[r.source] = (x.src[r.source] || 0) + r.n;
        out.total += r.cost; out.n += r.n;
      }
      return out;
    }
    const dayTotals = (from, to) => { const m = {}; for (const r of S.rows) if (r.date >= from && r.date <= to) { const x = (m[r.date] ||= { total: 0, chat: 0, autonomous: 0, other: 0 }); x.total += r.cost; x[kindOf(r.source)] += r.cost; } return m; };

    function budgetCard() {
      const b = S.base, today = b.today_str;
      const total = daysBetween(b.cycle_start, b.cycle_end);          // cycle_end はつぎの周期のはじめの日
      const now = new Date();
      const elapsed = daysBetween(b.cycle_start, today) + (now.getHours() * 60 + now.getMinutes()) / 1440;
      const goalNow = b.budget * elapsed / total;
      const used = b.month_total;
      const diff = used - goalNow;
      const pace = elapsed > 0.2 ? used / elapsed * total : used;
      const left = Math.max(0.5, total - elapsed);
      const perDayOk = Math.max(0, (b.budget - used) / left);
      const pct = v => Math.max(0, Math.min(100, v / b.budget * 100));
      const st = pace <= b.budget ? ["ok", "✓ 予算内のペース"] : pace <= b.budget * 1.1 ? ["warn", "△ 少し超えるペース"] : ["bad", "！ 超えるペース"];
      const lastDay = addDays(b.cycle_end, -1);
      return `<div class="m-card"><span class="a-heading">今月の予算(${md(b.cycle_start)}〜${md(lastDay)})</span>
        <div><span class="c-state ${st[0]}">${st[1]}</span></div>
        <div class="c-track" role="img" aria-label="使った ${money(used)}、いまの目安 ${money(goalNow)}、予算 ${money(b.budget)}">
          <div class="c-fill" style="width:${pct(used)}%;background:${st[0] === "ok" ? "var(--ui-ok, #4c9a6a)" : st[0] === "warn" ? "#B8860B" : "var(--ui-danger)"}"></div>
          <div class="c-mark" style="left:calc(${pct(goalNow)}% - 1px)"></div>
          <div class="c-marklbl" style="left:${pct(goalNow)}%">いまの目安 ${money(goalNow)}</div>
        </div>
        <div class="c-budget-text">
          予算 <b>${money(b.budget)}</b> のうち <b>${money(used)}</b> 使った(残り ${money(b.remaining)}、${md(lastDay)} まで あと ${b.days_remaining} 日)<br>
          いまの目安より <b class="${diff > 0 ? "c-up" : "c-down"}">${money(Math.abs(diff))} ${diff > 0 ? "多い" : "少ない"}</b>。
          このままだと ${md(lastDay)} には <b>${money(pace)}</b> くらい<br>
          残りを予算内にするなら、1 日 <b>${money(perDayOk)}</b> まで(ふつうの目安は 1 日 ${money(b.budget / total)})
        </div></div>`;
    }

    function heroCard(from, to, cur) {
      const span = daysBetween(from, to) + 1;
      const [pf, pt] = S.view === "month" ? cycleOf(addDays(from, -1)) : [addDays(from, -span), addDays(from, -1)];
      const prev = sum(pf, pt);
      const d = cur.total - prev.total;
      const prevName = { day: "前の日", week: "その前の 7 日", month: "前の周期" }[S.view];
      const perDay = S.base.budget / daysBetween(S.base.cycle_start, S.base.cycle_end);
      const isToday = to === S.base.today_str;
      const days = isToday ? Math.max(1, daysBetween(from, to) + 1) : span;
      const sub = S.view === "day"
        ? `1 日の目安 ${money(perDay)}${isToday ? "(今日はまだ途中)" : ""}`
        : `1 日あたり ${money(cur.total / days)}(目安 ${money(perDay)})`;
      return `<div class="m-card"><div class="c-hero"><span class="v">${money(cur.total)}</span>
        <span class="s">${cur.n.toLocaleString()} 回<br>${prevName}(${money(prev.total)})より <span class="${d > 0 ? "c-up" : "c-down"}">${d >= 0 ? "+" : "−"}${money(Math.abs(d))}</span></span></div>
        <div class="c-hint" style="margin-top:4px">${sub}</div></div>`;
    }

    function tableCard(cur) {
      const ids = S.chars.map(c => c.id).filter(id => cur.by[id]).concat(Object.keys(cur.by).filter(id => !S.chars.find(c => c.id === id)));
      const K = ["chat", "autonomous", "other"];
      const cell = x => x && x.n ? `<span class="m">${money(x.cost)}</span><span class="n">${x.n} 回</span>` : `<span class="n">—</span>`;
      const per = x => x && x.n ? money3(x.cost / x.n) : "—";
      const otherTitle = x => x ? Object.entries(x.src).map(([k, v]) => `${OTHER_LABELS[k] || k} ${v} 回`).join("、") : "";
      const who = id => `${id ? `<span class="c-dot" style="background:${esc(colorOf(id))}"></span>` : ""}${esc(nameOf(id))}`;
      const tot = Object.fromEntries(K.map(k => [k, { n: 0, cost: 0 }]));
      const rows = ids.map(id => {
        const c = cur.by[id]; let t = 0, n = 0;
        for (const k of K) if (c[k]) { tot[k].n += c[k].n; tot[k].cost += c[k].cost; t += c[k].cost; n += c[k].n; }
        return `<tr><td>${who(id)}</td><td>${cell(c.chat)}</td><td>${cell(c.autonomous)}</td><td title="${esc(otherTitle(c.other))}">${cell(c.other)}</td><td><span class="m"><b>${money(t)}</b></span><span class="n">${n} 回</span></td></tr>`;
      }).join("");
      const perRows = ids.filter(id => cur.by[id].chat || cur.by[id].autonomous).map(id => `<tr><td>${who(id)}</td><td>${per(cur.by[id].chat)}</td><td>${per(cur.by[id].autonomous)}</td></tr>`).join("");
      if (!rows) return '<div class="m-card"><span class="a-heading">だれが・何に</span><div class="p-empty">この期間は使っていません</div></div>';
      return `<div class="m-card"><span class="a-heading">だれが・何に</span>
        <div class="c-scroll"><table class="c-table"><thead><tr><th>だれ</th><th>会話</th><th>ひとり</th><th>ほか</th><th>計</th></tr></thead>
        <tbody>${rows}</tbody><tfoot><tr><td>みんな</td>${K.map(k => `<td>${cell(tot[k])}</td>`).join("")}<td><span class="m">${money(cur.total)}</span><span class="n">${cur.n} 回</span></td></tr></tfoot></table></div>
        <div class="c-hint">会話 = ダッシュボードやターミナルで話した 1 往復。ひとり = ひとりの時間(自律行動)の 1 回。ほか = 日記・ボタンなど</div></div>
      <div class="m-card"><span class="a-heading">1 回あたり</span>
        <table class="c-table"><thead><tr><th>だれ</th><th>会話</th><th>ひとりの時間</th></tr></thead><tbody>${perRows}</tbody>
        <tfoot><tr><td>みんな</td><td>${per(tot.chat)}</td><td>${per(tot.autonomous)}</td></tr></tfoot></table></div>`;
    }

    // 棒グラフ。週・月は 1 日 1 本(押すとその日へ)、日は 1 時間 1 本
    function chartCard(from, to) {
      let bars = [], goal = 0, title;
      if (S.view === "day") {
        const runs = S.runs[from] || [];
        const h = Array.from({ length: 24 }, (_, i) => ({ key: i, label: `${i}時`, total: 0, chat: 0, autonomous: 0, other: 0 }));
        for (const r of runs) { const x = h[Number(r.time.slice(0, 2))]; x.total += r.cost; x[kindOf(r.source)] += r.cost; }
        bars = h; title = "1 時間ごと";
      } else {
        const m = dayTotals(from, to);
        for (let d = from; d <= to; d = addDays(d, 1)) bars.push({ key: d, label: md(d), total: 0, chat: 0, autonomous: 0, other: 0, ...(m[d] || {}) });
        goal = S.base.budget / daysBetween(S.base.cycle_start, S.base.cycle_end);
        title = "1 日ごと(押すとその日)";
      }
      const W = 600, H = 180, top = 10, bottom = 22, n = bars.length;
      const max = Math.max(goal * 1.15, 0.01, ...bars.map(b => b.total));
      const y = v => top + (H - top - bottom) * (1 - v / max);
      const bw = W / n, gap = Math.min(4, bw * 0.25), w = Math.max(1, bw - gap);
      const every = n > 16 ? Math.ceil(n / 8) : n > 12 ? 2 : 1;
      const svg = bars.map((b, i) => {
        const x = i * bw + gap / 2, yy = y(b.total), hh = Math.max(b.total > 0 ? 2 : 0, H - bottom - yy);
        const r = Math.min(4, w / 2, hh);
        const path = hh > 0 ? `M${x},${H - bottom} V${H - bottom - hh + r} Q${x},${H - bottom - hh} ${x + r},${H - bottom - hh} H${x + w - r} Q${x + w},${H - bottom - hh} ${x + w},${H - bottom - hh + r} V${H - bottom} Z` : "";
        const sel = S.view !== "day" && b.key === S.date;
        return `<rect class="hit" x="${i * bw}" y="0" width="${bw}" height="${H}" data-i="${i}"></rect>${path ? `<path class="bar${sel ? " is-sel" : ""}" d="${path}"></path>` : ""}`
          + (i % every === 0 ? `<text class="axis" x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${esc(S.view === "day" ? String(b.key) : b.label)}</text>` : "");
      }).join("");
      const goalLine = goal ? `<line class="goal" x1="0" x2="${W}" y1="${y(goal)}" y2="${y(goal)}"></line><text class="axis" x="${W}" y="${y(goal) - 4}" text-anchor="end">目安 ${money(goal)}</text>` : "";
      S._bars = bars;
      return `<div class="m-card"><span class="a-heading">${title}</span>
        <div class="c-chart" id="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${title}の代">
          <line class="base" x1="0" x2="${W}" y1="${H - bottom}" y2="${H - bottom}"></line>${svg}${goalLine}</svg><div class="c-tip" id="tip" hidden></div></div>
        ${goal ? '<div class="c-legend">点線は 1 日の目安(予算 ÷ 周期の日数)</div>' : ""}</div>`;
    }

    function runsCard(date) {
      const runs = S.runs[date];
      if (!runs) return `<div class="m-card"><span class="a-heading">1 回ずつ</span><div class="p-empty">読み込み中…</div></div>`;
      const shown = S.allRuns ? runs : runs.slice(0, 30);
      return `<div class="m-card"><span class="a-heading">1 回ずつ(新しい順)</span>
        ${shown.map(r => `<div class="c-run"><span class="t">${esc(r.time)}</span><span>${r.character ? `<span class="c-dot" style="background:${esc(colorOf(r.character))}"></span>` : ""}${esc(nameOf(r.character))} <span class="k">${esc(KIND[r.source] || OTHER_LABELS[r.source] || r.source)}</span></span><span>${money3(r.cost)}</span></div>`).join("") || '<div class="p-empty">この日は使っていません</div>'}
        ${runs.length > shown.length ? `<button class="a-btn a-btn--sub a-btn--s" id="moreRuns" style="margin-top:8px">ぜんぶ見る(${runs.length} 回)</button>` : ""}</div>`;
    }

    async function ensureRuns(date) {
      if (S.runs[date]) return;
      try { S.runs[date] = (await (await fetch("/api/costs/runs?date=" + date)).json()).runs; } catch (e) { S.runs[date] = []; }
      render();
    }

    function render() {
      const [from, to] = rangeOf(S.view, S.date);
      const cur = sum(from, to);
      const label = S.view === "day" ? (S.date === S.base.today_str ? "今日 " : S.date === addDays(S.base.today_str, -1) ? "昨日 " : "") + mdw(S.date)
        : `${md(from)}〜${md(to)}`;
      const atEnd = S.view === "month" ? to >= S.base.today_str : S.date >= S.base.today_str;
      document.getElementById("main").innerHTML = `
        <div class="c-bar-row">
          ${[["day", "日"], ["week", "週"], ["month", "月"]].map(([v, l]) => `<button class="a-pill${S.view === v ? " is-on" : ""}" aria-pressed="${S.view === v}" data-view="${v}">${l}</button>`).join("")}
          <div class="c-nav"><button class="a-btn a-btn--sub a-btn--s" data-step="-1" aria-label="前">‹</button><span class="lbl">${esc(label)}</span>
            <button class="a-btn a-btn--sub a-btn--s" data-step="1" aria-label="次"${atEnd ? " disabled" : ""}>›</button>
            ${S.date !== S.base.today_str ? '<button class="a-btn a-btn--sub a-btn--s" data-today>今日</button>' : ""}</div>
        </div>
        ${heroCard(from, to, cur)}
        ${chartCard(from, to)}
        ${tableCard(cur)}
        ${S.view === "day" ? runsCard(S.date) : ""}
        ${budgetCard()}
        <div class="c-hint">代は Claude に払った分の見積もり(1 回ぶんに直した値)。続きの会話の累計は差に直しています。</div>`;
      if (S.view === "day") ensureRuns(S.date);
    }

    document.addEventListener("click", e => {
      const v = e.target.closest("[data-view]");
      if (v) { S.view = v.dataset.view; try { localStorage.setItem("costs.view", S.view); } catch (er) {} render(); return; }
      const st = e.target.closest("[data-step]");
      if (st) {
        const k = Number(st.dataset.step);
        if (S.view === "day") S.date = addDays(S.date, k);
        else if (S.view === "week") S.date = addDays(S.date, 7 * k);
        else { const [f, t] = cycleOf(S.date); S.date = k < 0 ? addDays(f, -1) : addDays(t, 1); }
        if (S.date > S.base.today_str) S.date = S.base.today_str;
        render(); return;
      }
      if (e.target.closest("[data-today]")) { S.date = S.base.today_str; render(); return; }
      if (e.target.closest("#moreRuns")) { S.allRuns = true; render(); return; }
      const hit = e.target.closest(".c-chart .hit");
      if (hit && S.view !== "day") { S.date = S._bars[Number(hit.dataset.i)].key; S.view = "day"; render(); }
    });
    document.addEventListener("mouseover", e => {
      const hit = e.target.closest(".c-chart .hit"), tip = document.getElementById("tip");
      if (!tip) return;
      if (!hit) { tip.hidden = true; return; }
      const b = S._bars[Number(hit.dataset.i)], box = document.getElementById("chart").getBoundingClientRect(), r = hit.getBoundingClientRect();
      tip.innerHTML = `<b>${esc(S.view === "day" ? `${b.key}時台` : mdw(b.key))} ${money(b.total)}</b><br>会話 ${money(b.chat)} ・ ひとりの時間 ${money(b.autonomous)}${b.other ? ` ・ ほか ${money(b.other)}` : ""}`;
      tip.hidden = false;
      const x = r.left - box.left + r.width / 2;
      tip.style.left = Math.max(0, Math.min(box.width - tip.offsetWidth, x - tip.offsetWidth / 2)) + "px";
      tip.style.top = "-6px";
    });

    (async () => {
      const empty = document.getElementById("empty");
      try {
        const [base, days] = await Promise.all([fetch("/api/costs").then(r => r.json()), fetch("/api/costs/days").then(r => r.json())]);
        S.base = base; S.rows = days.rows; S.date = base.today_str;
        try { S.chars = await (await fetch("/api/characters/all")).json(); } catch (e) {}
      } catch (e) { empty.textContent = "読み込めませんでした"; return; }
      empty.style.display = "none";
      render();
    })();
  </script>
</body>
</html>
