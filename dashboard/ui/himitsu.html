<!DOCTYPE html>
<html lang="ja" data-ui="foster">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ひみつ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&family=M+PLUS+Rounded+1c:wght@400;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/ui/tokens.css">
  <link rel="stylesheet" href="/ui/atoms.css">
  <link rel="stylesheet" href="/ui/molecules.css">
  <link rel="stylesheet" href="/ui/pages.css">
  <script src="/ui/page.js"></script>
  <script src="/ui/md.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <style>
    /* ひみつ(手紙を読むページ)。ぷちどうし / みんなのメール を切り替え、だれから・だれあて で絞る。1 通 = 差出人の色の 1 枚 */
    .h-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
    .h-bar label { display: inline-flex; align-items: center; gap: 6px; font-size: var(--ui-fs-s); color: var(--ui-text-sub); }
    .h-bar select { min-height: var(--ui-ctl-h-s); max-width: 11em; padding: 0 8px; font: inherit; font-size: var(--ui-fs-s); color: var(--ui-text); background: var(--ui-surface); border: var(--ui-line-w) solid var(--ui-line-soft); border-radius: var(--ui-radius-s); }
    .h-count { margin: 0 2px 10px; font-size: var(--ui-fs-s); color: var(--ui-text-sub); }
    .h-mail { margin-bottom: 10px; padding: 12px 14px; border: var(--ui-line-w) solid; border-radius: var(--ui-radius-card); }
    .h-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 6px; }
    .h-who { display: inline-flex; align-items: center; gap: 6px; font-size: 0.9rem; font-weight: 700; }
    .h-dot { flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(58, 50, 45, 0.18); }
    .h-date { margin-left: auto; font-size: 0.75rem; color: var(--ui-text-sub); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .h-body { font-size: 0.92rem; line-height: 1.7; color: var(--ui-text); overflow-wrap: anywhere; }
    .h-body h1, .h-body h2, .h-body h3 { margin: 8px 0 4px; font-family: var(--ui-font-head); font-size: 1rem; }
    .h-body > :first-child { margin-top: 0; }
    .h-body > :last-child { margin-bottom: 0; }
    .h-body p { margin: 6px 0; }
    .h-body ul, .h-body ol { margin: 4px 0; padding-left: 1.3em; }
    .h-body blockquote { margin: 6px 0; padding: 0 10px; color: var(--ui-text-sub); border-left: 3px solid rgba(58, 50, 45, 0.18); }
    .h-body code { font-size: 0.85em; padding: 1px 5px; border-radius: 6px; background: rgba(255, 255, 255, 0.7); }
    .h-body pre { padding: 8px 10px; overflow-x: auto; font-size: 0.82rem; background: rgba(255, 255, 255, 0.7); border-radius: var(--ui-radius-s); }
    .h-body pre code { padding: 0; background: none; }
    .h-body hr { margin: 8px 0; border: none; border-top: 1px dashed rgba(58, 50, 45, 0.2); }
    .h-body a { color: var(--ui-accent-text); }
    .h-body table { display: block; overflow-x: auto; border-collapse: collapse; font-size: 0.9em; }
    .h-body th, .h-body td { padding: 3px 8px; border: 1px solid rgba(58, 50, 45, 0.18); }
    /* だれと、何通: 1 人 1 枚。相手ごとに「送った → / もらった ←」。数を押すと、その組み合わせで下の手紙を絞る */
    .h-sum { margin-bottom: 12px; }
    .h-sum > summary { cursor: pointer; padding: 4px 2px 8px; font-size: var(--ui-fs-s); font-weight: 700; color: var(--ui-accent-text); }
    .h-people { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
    .h-person { padding: 12px 14px; background: var(--ui-surface); border: var(--ui-line-w) solid var(--ui-line-soft); border-top: 3px solid; border-radius: var(--ui-radius-card); }
    .h-person h2 { display: flex; align-items: center; gap: 6px; margin: 0 0 2px; font-family: var(--ui-font-head); font-size: 1rem; }
    .h-total { margin-bottom: 6px; font-size: 0.75rem; color: var(--ui-text-sub); }
    .h-pair { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 6px; padding: 3px 0; font-size: 0.88rem; }
    .h-pair .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .h-num { min-width: 4.6em; padding: 2px 8px; font: inherit; font-size: 0.78rem; font-variant-numeric: tabular-nums; text-align: right; color: var(--ui-text); background: var(--ui-surface-soft); border: var(--ui-line-w) solid var(--ui-line-soft); border-radius: 999px; cursor: pointer; }
    .h-num:hover { background: var(--ui-accent-soft); }
    .h-num[disabled] { color: var(--ui-text-mute); background: none; border-color: transparent; cursor: default; }
    .h-legend { margin-top: 8px; font-size: 0.72rem; color: var(--ui-text-mute); }
    .h-more { display: block; margin: 12px auto; }
    .h-more[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="p-wrap">
    <div class="p-head"><a class="a-btn a-btn--sub a-btn--s" href="/">← もどる</a><h1>🔒 ひみつ</h1></div>
    <div class="h-bar" id="scopes"></div>
    <details class="h-sum" id="sum" open><summary>📊 だれと、何通</summary><div class="h-people" id="people"></div>
      <div class="h-legend">「→」は送った数、「←」はもらった数。数を押すと、その組み合わせの手紙だけになります。家のメールボックスの手紙を数えています(ぷちSNS の手紙は入りません)。</div></details>
    <div class="h-bar">
      <label>だれから <select id="from"></select></label>
      <label>だれあて <select id="to"></select></label>
    </div>
    <div class="h-count" id="count"></div>
    <div id="list"></div>
    <button class="a-btn a-btn--sub h-more" id="more" hidden>もっと見る ↓</button>
    <div class="p-empty" id="empty">読み込み中…</div>
  </div>
  <script>
    const { esc } = PetitPage;
    const PAGE = 30;
    const SCOPES = [["petit", "ぷちどうし"], ["all", "みんなのメール"]];
    const state = { scope: "petit", from: "", to: "", shown: 0, total: 0, people: {} };
    const $ = id => document.getElementById(id);
    // 差出人の色から: 背景(うすく)・枠・名前の文字(白い地でも読める濃さ)。色の無い人は、白いカード
    const tint = (c, p) => c ? `color-mix(in srgb, ${c} ${p}%, #fff)` : "";
    const ink = c => c ? `color-mix(in srgb, ${c} 50%, #3A322D)` : "var(--ui-text)";
    const nameOf = id => (state.people[id] || {}).name || id || "(わからない)";
    // 本文は markdown。手紙にはだれが何を書いてくるか分からないので、HTML のタグは文字として出し、リンクは http(s) と mailto だけ残す
    function md(text) {
      const src = String(text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
      let html = window.marked ? marked.parse(src, { breaks: true }) : `<pre>${src}</pre>`;
      if (window.fixCjkBold) html = fixCjkBold(html);
      const box = document.createElement("template");
      box.innerHTML = html;
      box.content.querySelectorAll("a").forEach(a => {
        if (!/^(https?:|mailto:)/i.test(a.getAttribute("href") || "")) a.removeAttribute("href");
        else { a.target = "_blank"; a.rel = "noopener noreferrer"; }
      });
      box.content.querySelectorAll("img").forEach(i => i.replaceWith(document.createTextNode(i.alt || "")));
      return box.innerHTML;
    }
    function card(m) {
      const c = (state.people[m.sender] || {}).color || "";
      const date = m.date ? m.date.replace(/^(\d{4})-(\d{2})-(\d{2})/, "$1/$2/$3") : "";
      return `<article class="h-mail" style="background:${tint(c, 16) || "var(--ui-surface)"};border-color:${tint(c, 48) || "var(--ui-line-soft)"}">
        <div class="h-head"><span class="h-who" style="color:${ink(c)}"><span class="h-dot" style="background:${esc(c || "#d9cdbf")}"></span>${esc(nameOf(m.sender))} → ${esc(nameOf(m.recipient))}</span><span class="h-date">${esc(date)}</span></div>
        <div class="h-body">${md(m.content)}</div>
      </article>`;
    }
    // だれと、何通: ぷちと家の人を 1 人 1 枚に。相手は、やり取りの多い順
    function summary(d) {
      const sent = {}, got = {};   // sent[a][b] = a から b へ / got[a][b] = b から a へ
      for (const p of d.pairs || []) {
        (sent[p.from] = sent[p.from] || {})[p.to] = p.count;
        (got[p.to] = got[p.to] || {})[p.from] = p.count;
      }
      const sum = o => Object.values(o || {}).reduce((a, b) => a + b, 0);
      const order = { petit: 0, human: 1 };
      const owners = Object.keys(state.people).filter(id => (state.people[id].kind in order) && (sent[id] || got[id]))
        .sort((a, b) => order[state.people[a].kind] - order[state.people[b].kind] || sum(sent[b]) + sum(got[b]) - sum(sent[a]) - sum(got[a]));
      const num = (n, from, to, arrow) => `<button class="h-num" data-from="${esc(from)}" data-to="${esc(to)}"${n ? "" : " disabled"}>${arrow} ${(n || 0).toLocaleString()}</button>`;
      $("people").innerHTML = owners.map(id => {
        const c = state.people[id].color || "";
        const partners = [...new Set([...Object.keys(sent[id] || {}), ...Object.keys(got[id] || {})])]
          .sort((a, b) => ((sent[id] || {})[b] || 0) + ((got[id] || {})[b] || 0) - ((sent[id] || {})[a] || 0) - ((got[id] || {})[a] || 0));
        return `<section class="h-person" style="border-top-color:${esc(c || "#d9cdbf")}">
          <h2 style="color:${ink(c)}"><span class="h-dot" style="background:${esc(c || "#d9cdbf")}"></span>${esc(nameOf(id))}</h2>
          <div class="h-total">送った ${sum(sent[id]).toLocaleString()} 通 ・ もらった ${sum(got[id]).toLocaleString()} 通 ・ 相手 ${partners.length} 人</div>
          ${partners.map(o => `<div class="h-pair"><span class="n">${esc(nameOf(o))}</span>${num((sent[id] || {})[o], id, o, "→")}${num((got[id] || {})[o], o, id, "←")}</div>`).join("")}
        </section>`;
      }).join("");
      $("sum").hidden = !owners.length;
    }
    function options(sel, rows, cur, any) {
      sel.innerHTML = `<option value="">${any}</option>` + rows.map(r => `<option value="${esc(r.id)}"${r.id === cur ? " selected" : ""}>${esc(nameOf(r.id))}(${r.count.toLocaleString()})</option>`).join("");
    }
    async function load(reset) {
      if (reset) { state.shown = 0; $("list").innerHTML = ""; $("empty").style.display = ""; $("empty").textContent = "読み込み中…"; $("more").hidden = true; }
      const q = new URLSearchParams({ scope: state.scope, sender: state.from, to: state.to, offset: state.shown, limit: PAGE });
      let d;
      try {
        const res = await fetch("/api/secret_mails?" + q);
        if (!res.ok) throw new Error(res.status);
        d = await res.json();
      } catch (e) { $("empty").style.display = ""; $("empty").textContent = "読み込めませんでした"; return; }
      state.people = d.people || {}; state.total = d.total; state.scope = d.scope;
      $("scopes").innerHTML = SCOPES.filter(([id]) => id !== "all" || d.can_all).map(([id, label]) =>
        `<button class="a-pill${id === state.scope ? " is-on" : ""}" aria-pressed="${id === state.scope}" data-scope="${id}">${label}</button>`).join("");
      summary(d);
      options($("from"), d.senders || [], state.from, "だれでも");
      options($("to"), d.recipients || [], state.to, "だれでも");
      $("list").insertAdjacentHTML("beforeend", (d.items || []).map(card).join(""));
      state.shown += (d.items || []).length;
      $("count").textContent = d.total ? `${d.total.toLocaleString()} 通(新しい順)` : "";
      $("empty").style.display = d.total ? "none" : "";
      $("empty").textContent = "この組み合わせの手紙は、ありません";
      $("more").hidden = state.shown >= d.total;
    }
    $("scopes").addEventListener("click", e => {
      const b = e.target.closest("[data-scope]");
      if (!b || b.dataset.scope === state.scope) return;
      state.scope = b.dataset.scope; state.from = ""; state.to = ""; load(true);   // 見る範囲を変えたら、絞り込みは外す
    });
    $("from").addEventListener("change", e => { state.from = e.target.value; load(true); });
    $("to").addEventListener("change", e => { state.to = e.target.value; load(true); });
    $("people").addEventListener("click", e => {
      const b = e.target.closest(".h-num:not([disabled])");
      if (!b) return;
      state.from = b.dataset.from; state.to = b.dataset.to;
      load(true).then(() => $("count").scrollIntoView({ behavior: "smooth", block: "start" }));
    });
    try {   // 開いているか・閉じているかは、この画面で覚えておく
      if (localStorage.getItem("himitsuSumClosed") === "1") $("sum").open = false;
      $("sum").addEventListener("toggle", () => { try { localStorage.setItem("himitsuSumClosed", $("sum").open ? "0" : "1"); } catch (e) {} });
    } catch (e) {}
    $("more").addEventListener("click", () => load(false));
    load(true);
  </script>
</body>
</html>
