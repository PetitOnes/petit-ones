<!DOCTYPE html>
<html lang="ja" data-ui="foster">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ひみつ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&family=M+PLUS+Rounded+1c:wght@400;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/ui/tokens.css">
  <link rel="stylesheet" href="/ui/atoms.css">
  <link rel="stylesheet" href="/ui/molecules.css">
  <link rel="stylesheet" href="/ui/pages.css">
  <script src="/ui/page.js"></script>
  <script src="/ui/md.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <style>
    /* ひみつ(手紙を読むページ + わたしている文 + 行動ログ)。ぷちどうし / みんなのメール を切り替え、だれから・だれあて で絞る。1 通 = 差出人の色の 1 枚 */
    .h-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
    .h-bar label { display: inline-flex; align-items: center; gap: 6px; font-size: var(--ui-fs-s); color: var(--ui-text-sub); }
    .h-bar select { min-height: var(--ui-ctl-h-s); max-width: 11em; padding: 0 8px; font: inherit; font-size: var(--ui-fs-s); color: var(--ui-text); background: var(--ui-surface); border: var(--ui-line-w) solid var(--ui-line-soft); border-radius: var(--ui-radius-s); }
    .h-count { margin: 0 2px 10px; font-size: var(--ui-fs-s); color: var(--ui-text-sub); }
    .h-mail { margin-bottom: 10px; padding: 12px 14px; border: var(--ui-line-w) solid; border-radius: var(--ui-radius-card); }
    .h-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 6px; }
    .h-who { display: inline-flex; align-items: center; gap: 6px; font-size: 0.9rem; font-weight: 700; }
    .h-dot { flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(58, 50, 45, 0.18); }
    .h-date { margin-left: auto; font-size: 0.75rem; color: var(--ui-text-sub); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .h-body { font-size: 0.92rem; line-height: 1.7; color: var(--ui-text); overflow-wrap: anywhere; }
    .h-body h1, .h-body h2, .h-body h3 { margin: 8px 0 4px; font-family: var(--ui-font-head); font-size: 1rem; }
    .h-body > :first-child { margin-top: 0; }
    .h-body > :last-child { margin-bottom: 0; }
    .h-body p { margin: 6px 0; }
    .h-body ul, .h-body ol { margin: 4px 0; padding-left: 1.3em; }
    .h-body blockquote { margin: 6px 0; padding: 0 10px; color: var(--ui-text-sub); border-left: 3px solid rgba(58, 50, 45, 0.18); }
    .h-body code { font-size: 0.85em; padding: 1px 5px; border-radius: 6px; background: rgba(255, 255, 255, 0.7); }
    .h-body pre { padding: 8px 10px; overflow-x: auto; font-size: 0.82rem; background: rgba(255, 255, 255, 0.7); border-radius: var(--ui-radius-s); }
    .h-body pre code { padding: 0; background: none; }
    .h-body hr { margin: 8px 0; border: none; border-top: 1px dashed rgba(58, 50, 45, 0.2); }
    .h-body a { color: var(--ui-accent-text); }
    .h-body table { display: block; overflow-x: auto; border-collapse: collapse; font-size: 0.9em; }
    .h-body th, .h-body td { padding: 3px 8px; border: 1px solid rgba(58, 50, 45, 0.18); }
    /* だれと、何通: 1 人 1 枚。相手ごとに「送った → / もらった ←」。数を押すと、その組み合わせで下の手紙を絞る */
    .h-sum { margin-bottom: 12px; }
    .h-sum > summary { cursor: pointer; padding: 4px 2px 8px; font-size: var(--ui-fs-s); font-weight: 700; color: var(--ui-accent-text); }
    .h-people { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
    .h-person { padding: 12px 14px; background: var(--ui-surface); border: var(--ui-line-w) solid var(--ui-line-soft); border-top: 3px solid; border-radius: var(--ui-radius-card); }
    .h-person h2 { display: flex; align-items: center; gap: 6px; margin: 0 0 2px; font-family: var(--ui-font-head); font-size: 1rem; }
    .h-total { margin-bottom: 6px; font-size: 0.75rem; color: var(--ui-text-sub); }
    .h-pair { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 6px; padding: 3px 0; font-size: 0.88rem; }
    .h-pair .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .h-num { min-width: 4.6em; padding: 2px 8px; font: inherit; font-size: 0.78rem; font-variant-numeric: tabular-nums; text-align: right; color: var(--ui-text); background: var(--ui-surface-soft); border: var(--ui-line-w) solid var(--ui-line-soft); border-radius: 999px; cursor: pointer; }
    .h-num:hover { background: var(--ui-accent-soft); }
    .h-num[disabled] { color: var(--ui-text-mute); background: none; border-color: transparent; cursor: default; }
    .h-legend { margin-top: 8px; font-size: 0.72rem; color: var(--ui-text-mute); }
    .h-more { display: block; margin: 12px auto; }
    .h-more[hidden] { display: none; }
    /* わたしている文: その子のプロンプトに入る文とファイルを、1 つずつ開いて読む */
    .h-views { display: flex; gap: 8px; margin-bottom: 12px; }
    [data-view-box][hidden] { display: none; }
    .h-views { flex-wrap: wrap; }
    [data-view][hidden] { display: none; }
    /* 行動ログ: ぷちが動いた 1 回ごとの記録。回を押すと、考えたこと・言ったこと・使った道具が時間の順に並ぶ */
    .g-kind { flex: 0 0 auto; padding: 1px 9px; font-size: 0.72rem; font-weight: 700; color: var(--ui-text-sub); background: var(--ui-surface-soft); border-radius: 999px; }
    .g-ev { margin-top: 8px; padding: 8px 12px; border: var(--ui-line-w) solid var(--ui-line-soft); border-radius: var(--ui-radius-s); overflow-wrap: anywhere; }
    .g-label { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; margin-bottom: 2px; font-size: 0.72rem; font-weight: 700; color: var(--ui-text-sub); }
    .g-text { margin: 0; white-space: pre-wrap; font-family: inherit; font-size: 0.9rem; line-height: 1.7; }
    .g-think { background: none; border-style: dashed; }
    .g-think .g-text { color: var(--ui-text-sub); }
    .g-tool, .g-res { background: var(--ui-surface-soft); border-color: transparent; }
    .g-tool .g-text, .g-res .g-text { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 0.78rem; line-height: 1.55; }
    .g-res { margin-top: 2px; margin-left: 14px; }
    .g-res.is-err { background: var(--ui-danger-soft); }
    .g-res.is-err .g-label { color: var(--ui-danger); }
    .g-clamp { max-height: 6.2em; overflow: hidden; }
    .g-open { margin-top: 2px; padding: 0; font: inherit; font-size: 0.75rem; color: var(--ui-accent-text); background: none; border: none; cursor: pointer; }
    .g-end { margin-top: 10px; font-size: 0.75rem; line-height: 1.6; color: var(--ui-text-sub); font-variant-numeric: tabular-nums; }
    .no-think .g-think, .no-res .g-res, .no-given .g-given { display: none; }
    .g-given { background: var(--ui-accent-soft); border-color: transparent; }
    .g-none { margin-top: 8px; font-size: 0.78rem; color: var(--ui-text-mute); }
    .all-open .g-clamp { max-height: none; }
    .all-open [data-open] { display: none; }
    .w-lead { margin: 0 2px 10px; font-size: var(--ui-fs-s); line-height: 1.6; color: var(--ui-text-sub); }
    .w-group { margin: 16px 2px 6px; font-family: var(--ui-font-head); font-size: 0.95rem; }
    .w-group small { margin-left: 6px; font-family: var(--ui-font); font-size: 0.75rem; font-weight: 400; color: var(--ui-text-sub); }
    .w-sec { margin-bottom: 8px; background: var(--ui-surface); border: var(--ui-line-w) solid var(--ui-line-soft); border-radius: var(--ui-radius-card); }
    .w-sec > summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 10px 14px; cursor: pointer; font-weight: 700; font-size: 0.92rem; }
    .w-meta { margin-left: auto; font-size: 0.75rem; font-weight: 400; color: var(--ui-text-sub); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .w-heavy { flex-basis: 100%; font-size: 0.78rem; font-weight: 400; color: var(--ui-danger); }
    .w-body { padding: 4px 14px 12px; border-top: var(--ui-line-w) dashed var(--ui-line-soft); }
    .w-body .h-body pre, .w-body .h-body code { background: var(--ui-surface-soft); }
    .w-raw { margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: inherit; font-size: 0.88rem; line-height: 1.7; }
    .w-note { margin: 8px 0 0; font-size: 0.75rem; line-height: 1.6; color: var(--ui-text-mute); }
    .w-tools { display: flex; justify-content: flex-end; margin-top: 6px; }
    .w-desires { padding: 12px 14px; background: var(--ui-surface); border: var(--ui-line-w) solid var(--ui-line-soft); border-radius: var(--ui-radius-card); }
    .w-desire { display: grid; grid-template-columns: minmax(6em, 11em) 1fr 3em; align-items: center; gap: 8px; padding: 3px 0; font-size: 0.88rem; }
    .w-bar { height: 8px; overflow: hidden; background: var(--ui-surface-soft); border-radius: 999px; }
    .w-bar > i { display: block; height: 100%; border-radius: 999px; }
    .w-desire .v { text-align: right; font-size: 0.78rem; color: var(--ui-text-sub); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="p-wrap">
    <div class="p-head"><a class="a-btn a-btn--sub a-btn--s" href="/">← もどる</a><h1>🔒 ひみつ</h1></div>
    <div class="h-views" id="views">
      <button class="a-pill is-on" aria-pressed="true" data-view="mail">💌 手紙</button>
      <button class="a-pill" aria-pressed="false" data-view="words">📜 わたしている文</button>
      <button class="a-pill" aria-pressed="false" data-view="logs">🔍 行動ログ</button>
      <button class="a-pill" aria-pressed="false" data-view="costs">💰 おかね</button>
    </div>
    <div data-view-box="mail">
    <div class="h-bar" id="scopes"></div>
    <details class="h-sum" id="sum" open><summary>📊 だれと、何通</summary><div class="h-people" id="people"></div>
      <div class="h-legend">「→」は送った数、「←」はもらった数。数を押すと、その組み合わせの手紙だけになります。家のメールボックスの手紙を数えています(ぷちSNS の手紙は入りません)。</div></details>
    <div class="h-bar">
      <label>だれから <select id="from"></select></label>
      <label>だれあて <select id="to"></select></label>
    </div>
    <div class="h-count" id="count"></div>
    <div id="list"></div>
    <button class="a-btn a-btn--sub h-more" id="more" hidden>もっと見る ↓</button>
    <div class="p-empty" id="empty">読み込み中…</div>
    </div>
    <div data-view-box="words" hidden>
      <p class="w-lead">ぷちが動くたびに、どんな文とファイルを受け取っているか。ここでは読むだけで、直すことはできません。</p>
      <div class="h-bar" id="wChars"></div>
      <div id="wList"></div>
      <div class="p-empty" id="wEmpty">読み込み中…</div>
    </div>
    <div data-view-box="logs" hidden>
      <p class="w-lead">ぷちが動いた 1 回ごとの記録。回を押すと、渡した文・考えたこと・言ったこと・使った道具・さいごの結果が、時間の順に並びます(新しい 50 回まで)。</p>
      <div class="h-bar" id="gChars"></div>
      <div class="h-bar" id="gKinds"></div>
      <div class="h-bar" id="gShow">
        <button class="a-pill is-on" aria-pressed="true" data-show="given">渡した文</button>
        <button class="a-pill is-on" aria-pressed="true" data-show="think">考えたこと</button>
        <button class="a-pill is-on" aria-pressed="true" data-show="res">道具の結果</button>
        <button class="a-pill" aria-pressed="false" data-all>長い文もぜんぶ開く</button>
      </div>
      <div class="h-count" id="gCount"></div>
      <div id="gList"></div>
      <div class="p-empty" id="gEmpty">読み込み中…</div>
    </div>
    <div data-view-box="costs" hidden>
      <iframe id="cFrame" title="おかね" style="display:block;width:100%;min-height:60vh;border:0;background:transparent"></iframe>
    </div>
  </div>
  <script>
    const { esc } = PetitPage;
    const PAGE = 30;
    const SCOPES = [["petit", "ぷちどうし"], ["all", "みんなのメール"]];
    const state = { scope: "petit", from: "", to: "", shown: 0, total: 0, people: {} };
    const $ = id => document.getElementById(id);
    // 差出人の色から: 背景(うすく)・枠・名前の文字(白い地でも読める濃さ)。色の無い人は、白いカード
    const tint = (c, p) => c ? `color-mix(in srgb, ${c} ${p}%, #fff)` : "";
    const ink = c => c ? `color-mix(in srgb, ${c} 50%, #3A322D)` : "var(--ui-text)";
    const nameOf = id => (state.people[id] || {}).name || id || "(わからない)";
    // 本文は markdown。手紙にはだれが何を書いてくるか分からないので、HTML のタグは文字として出し、リンクは http(s) と mailto だけ残す
    function md(text) {
      const src = String(text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
      let html = window.marked ? marked.parse(src, { breaks: true }) : `<pre>${src}</pre>`;
      if (window.fixCjkBold) html = fixCjkBold(html);
      const box = document.createElement("template");
      box.innerHTML = html;
      box.content.querySelectorAll("a").forEach(a => {
        if (!/^(https?:|mailto:)/i.test(a.getAttribute("href") || "")) a.removeAttribute("href");
        else { a.target = "_blank"; a.rel = "noopener noreferrer"; }
      });
      box.content.querySelectorAll("img").forEach(i => i.replaceWith(document.createTextNode(i.alt || "")));
      return box.innerHTML;
    }
    function card(m) {
      const c = (state.people[m.sender] || {}).color || "";
      const date = m.date ? m.date.replace(/^(\d{4})-(\d{2})-(\d{2})/, "$1/$2/$3") : "";
      return `<article class="h-mail" style="background:${tint(c, 16) || "var(--ui-surface)"};border-color:${tint(c, 48) || "var(--ui-line-soft)"}">
        <div class="h-head"><span class="h-who" style="color:${ink(c)}"><span class="h-dot" style="background:${esc(c || "#d9cdbf")}"></span>${esc(nameOf(m.sender))} → ${esc(nameOf(m.recipient))}</span><span class="h-date">${esc(date)}</span></div>
        <div class="h-body">${md(m.content)}</div>
      </article>`;
    }
    // だれと、何通: ぷちと家の人を 1 人 1 枚に。相手は、やり取りの多い順
    function summary(d) {
      const sent = {}, got = {};   // sent[a][b] = a から b へ / got[a][b] = b から a へ
      for (const p of d.pairs || []) {
        (sent[p.from] = sent[p.from] || {})[p.to] = p.count;
        (got[p.to] = got[p.to] || {})[p.from] = p.count;
      }
      const sum = o => Object.values(o || {}).reduce((a, b) => a + b, 0);
      const order = { petit: 0, human: 1 };
      const owners = Object.keys(state.people).filter(id => (state.people[id].kind in order) && (sent[id] || got[id]))
        .sort((a, b) => order[state.people[a].kind] - order[state.people[b].kind] || sum(sent[b]) + sum(got[b]) - sum(sent[a]) - sum(got[a]));
      const num = (n, from, to, arrow) => `<button class="h-num" data-from="${esc(from)}" data-to="${esc(to)}"${n ? "" : " disabled"}>${arrow} ${(n || 0).toLocaleString()}</button>`;
      $("people").innerHTML = owners.map(id => {
        const c = state.people[id].color || "";
        const partners = [...new Set([...Object.keys(sent[id] || {}), ...Object.keys(got[id] || {})])]
          .sort((a, b) => ((sent[id] || {})[b] || 0) + ((got[id] || {})[b] || 0) - ((sent[id] || {})[a] || 0) - ((got[id] || {})[a] || 0));
        return `<section class="h-person" style="border-top-color:${esc(c || "#d9cdbf")}">
          <h2 style="color:${ink(c)}"><span class="h-dot" style="background:${esc(c || "#d9cdbf")}"></span>${esc(nameOf(id))}</h2>
          <div class="h-total">送った ${sum(sent[id]).toLocaleString()} 通 ・ もらった ${sum(got[id]).toLocaleString()} 通 ・ 相手 ${partners.length} 人</div>
          ${partners.map(o => `<div class="h-pair"><span class="n">${esc(nameOf(o))}</span>${num((sent[id] || {})[o], id, o, "→")}${num((got[id] || {})[o], o, id, "←")}</div>`).join("")}
        </section>`;
      }).join("");
      $("sum").hidden = !owners.length;
    }
    function options(sel, rows, cur, any) {
      sel.innerHTML = `<option value="">${any}</option>` + rows.map(r => `<option value="${esc(r.id)}"${r.id === cur ? " selected" : ""}>${esc(nameOf(r.id))}(${r.count.toLocaleString()})</option>`).join("");
    }
    async function load(reset) {
      if (reset) { state.shown = 0; $("list").innerHTML = ""; $("empty").style.display = ""; $("empty").textContent = "読み込み中…"; $("more").hidden = true; }
      const q = new URLSearchParams({ scope: state.scope, sender: state.from, to: state.to, offset: state.shown, limit: PAGE });
      let d;
      try {
        const res = await fetch("/api/secret_mails?" + q);
        if (!res.ok) throw new Error(res.status);
        d = await res.json();
      } catch (e) { $("empty").style.display = ""; $("empty").textContent = "読み込めませんでした"; return; }
      state.people = d.people || {}; state.total = d.total; state.scope = d.scope;
      $("scopes").innerHTML = SCOPES.filter(([id]) => id !== "all" || d.can_all).map(([id, label]) =>
        `<button class="a-pill${id === state.scope ? " is-on" : ""}" aria-pressed="${id === state.scope}" data-scope="${id}">${label}</button>`).join("");
      summary(d);
      options($("from"), d.senders || [], state.from, "だれでも");
      options($("to"), d.recipients || [], state.to, "だれでも");
      $("list").insertAdjacentHTML("beforeend", (d.items || []).map(card).join(""));
      state.shown += (d.items || []).length;
      $("count").textContent = d.total ? `${d.total.toLocaleString()} 通(新しい順)` : "";
      $("empty").style.display = d.total ? "none" : "";
      $("empty").textContent = "この組み合わせの手紙は、ありません";
      $("more").hidden = state.shown >= d.total;
    }
    $("scopes").addEventListener("click", e => {
      const b = e.target.closest("[data-scope]");
      if (!b || b.dataset.scope === state.scope) return;
      state.scope = b.dataset.scope; state.from = ""; state.to = ""; load(true);   // 見る範囲を変えたら、絞り込みは外す
    });
    $("from").addEventListener("change", e => { state.from = e.target.value; load(true); });
    $("to").addEventListener("change", e => { state.to = e.target.value; load(true); });
    $("people").addEventListener("click", e => {
      const b = e.target.closest(".h-num:not([disabled])");
      if (!b) return;
      state.from = b.dataset.from; state.to = b.dataset.to;
      load(true).then(() => $("count").scrollIntoView({ behavior: "smooth", block: "start" }));
    });
    try {   // 開いているか・閉じているかは、この画面で覚えておく
      if (localStorage.getItem("himitsuSumClosed") === "1") $("sum").open = false;
      $("sum").addEventListener("toggle", () => { try { localStorage.setItem("himitsuSumClosed", $("sum").open ? "0" : "1"); } catch (e) {} });
    } catch (e) {}
    $("more").addEventListener("click", () => load(false));

    // ---- わたしている文 ----
    const words = { character: "", loaded: false, text: {} };
    const kb = n => n >= 1024 ? `${(n / 1024).toFixed(n >= 10240 ? 0 : 1)} KB` : `${n} B`;
    const when = t => t ? t.replace(/^\d{4}-(\d{2})-(\d{2})T/, "$1/$2 ") : "";
    const NOTES = {
      auto_prompt: "いま組み立てたら、の形です(通常回。5 回に 1 回ほどのルーチン回は「ROUTINES.md から一つ選んで」という一文に変わります)。@ で始まる行は、そのファイルの中身がまるごと付く印です。記念日・手紙やノートが読まれた・体の出来事・空や部屋が変わった、などの知らせは、その回にあったときだけ足されるので、ここには出ません。",
      chat_prompt: "ダッシュボードで話しかけたとき、会話のはじめに渡す文です。SOUL がまるごと入ります。空や部屋が変わった知らせは、あったときだけ足されるので、ここには出ません。",
    };
    function section(s, d) {
      const meta = s.kind === "file" ? `${esc(s.name)} ・ ${kb(s.size)} ・ ${esc(when(s.mtime))}` : "";
      const heavy = s.heavy === "drop" ? `⚠️ ${d.drop_kb} KB を超えています。自律行動には付いていないかもしれません`
        : s.heavy === "warn" ? `⚠️ 重くなっています(目安 ${d.warn_kb} KB。${d.drop_kb} KB を超えると付かなくなります)` : "";
      return `<details class="w-sec" data-key="${esc(s.key)}" data-kind="${esc(s.kind)}"><summary><span>${esc(s.title)}</span><span class="w-meta">${meta}</span>${heavy ? `<span class="w-heavy">${heavy}</span>` : ""}</summary><div class="w-body"><div class="p-empty">読み込み中…</div></div></details>`;
    }
    function desires(d) {
      const rows = (d.desires || {}).rows || [];
      if (!rows.length) return "";
      const max = Math.max(1, ...rows.map(r => r.level));   // 値は 0〜1(古い形は 0〜100)
      const at = when((d.desires.updated_at || "").slice(0, 16));
      return `<h2 class="w-group">欲求 <small>ぷちが道具(get_desires)で見に行く、いまの値${at ? `。${esc(at)} 時点` : ""}</small></h2><div class="w-desires">` +
        rows.map(r => `<div class="w-desire"><span>${esc(r.label)}</span><span class="w-bar"><i style="width:${Math.round(100 * r.level / max)}%;background:${esc(r.color || "#d9cdbf")}"></i></span><span class="v">${(max <= 1 ? Math.round(r.level * 100) : Math.round(r.level))}</span></div>`).join("") + `</div>`;
    }
    async function loadWords(cid) {
      $("wEmpty").style.display = ""; $("wEmpty").textContent = "読み込み中…"; $("wList").innerHTML = "";
      let d;
      try {
        const res = await fetch("/api/secret_prompts?" + new URLSearchParams({ character: cid || "" }));
        if (!res.ok) throw new Error(res.status);
        d = await res.json();
      } catch (e) { $("wEmpty").textContent = "読み込めませんでした"; return; }
      words.loaded = true; words.character = d.character; words.text = {};
      if (!d.characters.length) { $("wChars").innerHTML = ""; $("wEmpty").textContent = "見られる子が、いません"; return; }
      $("wChars").innerHTML = d.characters.map(c => `<button class="a-pill${c.id === d.character ? " is-on" : ""}" aria-pressed="${c.id === d.character}" data-char="${esc(c.id)}"><span class="h-dot" style="background:${esc(c.color || "#d9cdbf")}"></span> ${esc(c.name)}</button>`).join("");
      const of = (kind, w) => d.sections.filter(s => s.kind === kind && s.when === w).map(s => section(s, d)).join("");
      const group = (title, sub, html) => html ? `<h2 class="w-group">${title} <small>${sub}</small></h2>${html}` : "";
      $("wList").innerHTML = group("毎回わたす文", "動くたびに、はじめに渡す", of("prompt", "always"))
        + group("毎回付くファイル", "上の文といっしょに、中身がまるごと付く", of("file", "always"))
        + desires(d)
        + group("自分で読みに行くファイル", "毎回は付かない。その子が要るときに開く", of("file", "self"));
      $("wEmpty").style.display = "none";
    }
    function showText(box, key, raw) {
      const t = words.text[key];
      const body = t.format === "md" && !raw ? `<div class="h-body">${md(t.content)}</div>` : `<pre class="w-raw">${esc(t.content)}</pre>`;
      const tools = t.format === "md" ? `<div class="w-tools"><button class="a-btn a-btn--sub a-btn--s" data-raw="${raw ? "" : "1"}">${raw ? "整えて読む" : "もとの文字のまま"}</button></div>` : "";
      box.innerHTML = tools + body + (NOTES[key] ? `<p class="w-note">${NOTES[key]}</p>` : "");
    }
    $("wList").addEventListener("toggle", async e => {   // 中身は、開いたときに取りに行く(大きいファイルがあるので)
      const el = e.target;
      if (!el.matches || !el.matches(".w-sec") || !el.open || words.text[el.dataset.key]) return;
      const key = el.dataset.key, box = el.querySelector(".w-body");
      try {
        const res = await fetch("/api/secret_prompts/content?" + new URLSearchParams({ character: words.character, key }));
        if (!res.ok) throw new Error(res.status);
        words.text[key] = await res.json();
        showText(box, key, false);
      } catch (err) { box.innerHTML = `<div class="p-empty">読み込めませんでした</div>`; }
    }, true);
    $("wList").addEventListener("click", e => {
      const b = e.target.closest("[data-raw]");
      if (!b) return;
      const el = b.closest(".w-sec");
      showText(el.querySelector(".w-body"), el.dataset.key, b.dataset.raw === "1");
    });
    $("wChars").addEventListener("click", e => {
      const b = e.target.closest("[data-char]");
      if (b && b.dataset.char !== words.character) loadWords(b.dataset.char);
    });
    // ---- 行動ログ ----
    // 記録の名前は <年月日>_<時分秒>[_<きっかけ>]_stream.jsonl。きっかけが無いものが、ひとりの時間(自律行動)
    const logs = { loaded: false, chars: [], character: "", files: [], kind: "all", got: {} };
    const KINDS = [["all", "すべて"], ["alone", "ひとりの時間"], ["chat", "会話"], ["body", "体のできごと"], ["other", "ほか"]];
    const SRC = { "": ["alone", "ひとりの時間"], chat: ["chat", "会話"], camera: ["body", "体: カメラ"], sensor: ["body", "体: センサー"], mic: ["body", "体: マイク"] };
    function parseRun(f) {
      const m = /^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})(?:_(.+))?_stream\.jsonl$/.exec(f);
      if (!m) return { file: f, kind: "other", label: "ほか", at: f.replace("_stream.jsonl", "") };
      const [kind, label] = SRC[m[7] || ""] || ["other", m[7]];
      return { file: f, kind, label, at: `${m[2]}/${m[3]} ${m[4]}:${m[5]}` };
    }
    const toolName = n => String(n || "?").replace(/^mcp__/, "").replace(/__/g, " › ");
    function block(cls, label, text) {   // 長い文は畳んで、押すと全部
      const t = String(text || "");
      const long = t.length > 320 || t.split("\n").length > 5;
      return `<div class="g-ev ${cls}"><div class="g-label">${label}</div>${t ? `<pre class="g-text${long ? " g-clamp" : ""}">${esc(t)}</pre>` : ""}${long ? `<button class="g-open" data-open>ぜんぶ見る ↓</button>` : ""}</div>`;
    }
    function runHtml(events) {
      if (!events.length) return `<div class="p-empty">記録が、空です</div>`;
      // 渡した文は、2026-11-16 から記録の隣に残している。それより前の回には無い
      const given = events.some(ev => ev.kind === "user_text" || ev.kind === "system_prompt") ? "" : `<div class="g-none g-given">📨 渡した文は、この回には残っていません(残すようにする前の記録です)</div>`;
      return given + events.map(ev => {
        if (ev.kind === "system_prompt") return block("g-given", "📜 はじめに渡した文(system prompt)", ev.text);
        // 考えたことの中身は、いまのモデルでは記録に入らないことが多い(量だけ、終わりの行に出る)
        if (ev.kind === "thinking") return (ev.text || "").trim() ? block("g-think", "💭 考えたこと", ev.text) : `<div class="g-none g-think">💭 考えた(中身は、記録に入っていません)</div>`;
        if (ev.kind === "text") return block("g-say", "💬 言ったこと", ev.text);
        if (ev.kind === "user_text") return block("g-given", "📨 渡した文", ev.text);
        if (ev.kind === "tool_call") {
          let input = "";
          try { input = JSON.stringify(ev.input, null, 2); } catch (e) { input = String(ev.input); }
          return block("g-tool", `🔧 道具を使った <span>${esc(toolName(ev.name))}</span>`, input === "{}" ? "" : input);
        }
        if (ev.kind === "tool_result") return block("g-res" + (ev.is_error ? " is-err" : ""), `↩ ${esc(toolName(ev.name))} ${ev.is_error ? "うまくいかなかった" : "の結果"}`, ev.text);
        if (ev.kind === "result") {
          const u = ev.usage || {}, n = v => (v || 0).toLocaleString();
          const denied = (ev.permission_denials || []).length ? `<br>使えなかった道具: ${ev.permission_denials.map(d => esc(toolName(d))).join("、")}` : "";
          const secs = ev.duration_ms ? ` ・ ${Math.round(ev.duration_ms / 1000)} 秒` : "";
          const think = ev.thinking_tokens ? ` ・ 考えた量 およそ ${n(ev.thinking_tokens)} トークン` : "";
          const how = `<br>終わり方: ${esc(ev.subtype || "?")}${ev.stop_reason ? `(${esc(ev.stop_reason)})` : ""}`;
          const fin = ev.result ? block("g-say", "📦 さいごの結果(result)", ev.result) : "";
          return `${fin}<div class="g-end">やりとり ${n(ev.turns)} 回${secs} ・ $${(ev.cost_usd || 0).toFixed(4)}${think}<br>入力 ${n(u.input)} / 出力 ${n(u.output)} / キャッシュ書き ${n(u.cache_creation)} / キャッシュ読み ${n(u.cache_read)}${how}${denied}</div>`;
        }
        if (ev.kind === "init") return `<div class="g-end">モデル: ${esc(ev.model || "?")}</div>`;
        return "";
      }).join("");
    }
    function showRuns() {
      const rows = logs.files.filter(r => logs.kind === "all" || r.kind === logs.kind);
      const has = new Set(logs.files.map(r => r.kind));
      $("gKinds").innerHTML = KINDS.filter(([id]) => id === "all" || has.has(id)).map(([id, label]) =>
        `<button class="a-pill${id === logs.kind ? " is-on" : ""}" aria-pressed="${id === logs.kind}" data-kind="${id}">${label}</button>`).join("");
      $("gList").innerHTML = rows.map(r => `<details class="w-sec" data-file="${esc(r.file)}"><summary><span class="g-kind">${esc(r.label)}</span><span>${esc(r.at)}</span></summary><div class="w-body"><div class="p-empty">読み込み中…</div></div></details>`).join("");
      $("gCount").textContent = rows.length ? `${rows.length} 回(新しい順)` : "";
      $("gEmpty").style.display = rows.length ? "none" : "";
      $("gEmpty").textContent = "記録は、ありません";
    }
    async function loadRuns(cid) {
      logs.character = cid; logs.files = []; logs.got = {};
      $("gChars").innerHTML = logs.chars.map(c => `<button class="a-pill${c.id === cid ? " is-on" : ""}" aria-pressed="${c.id === cid}" data-char="${esc(c.id)}"><span class="h-dot" style="background:${esc(c.color || "#d9cdbf")}"></span> ${esc(c.name)}</button>`).join("");
      $("gList").innerHTML = ""; $("gCount").textContent = ""; $("gEmpty").style.display = ""; $("gEmpty").textContent = "読み込み中…";
      try {
        const res = await fetch(`/api/stream-logs/${encodeURIComponent(cid)}`);
        if (!res.ok) throw new Error(res.status);
        logs.files = (await res.json()).map(parseRun);
      } catch (e) { $("gEmpty").textContent = "読み込めませんでした"; return; }
      if (!logs.files.some(r => r.kind === logs.kind)) logs.kind = "all";
      showRuns();
    }
    async function loadLogChars() {
      logs.loaded = true;
      try { logs.chars = (await (await fetch("/api/secret_prompts")).json()).characters || []; } catch (e) { logs.chars = []; }
      if (!logs.chars.length) { $("gEmpty").textContent = "見られる子が、いません"; return; }
      loadRuns(logs.chars[0].id);
    }
    $("gChars").addEventListener("click", e => { const b = e.target.closest("[data-char]"); if (b && b.dataset.char !== logs.character) loadRuns(b.dataset.char); });
    $("gKinds").addEventListener("click", e => { const b = e.target.closest("[data-kind]"); if (b && b.dataset.kind !== logs.kind) { logs.kind = b.dataset.kind; showRuns(); } });
    $("gShow").addEventListener("click", e => {
      const b = e.target.closest("[data-show], [data-all]");
      if (!b) return;
      const on = !b.classList.contains("is-on");
      b.classList.toggle("is-on", on); b.setAttribute("aria-pressed", on);
      if ("all" in b.dataset) $("gList").classList.toggle("all-open", on);
      else $("gList").classList.toggle("no-" + b.dataset.show, !on);
    });
    $("gList").addEventListener("toggle", async e => {   // 1 回の中身は、開いたときに取りに行く
      const el = e.target;
      if (!el.matches || !el.matches(".w-sec") || !el.open || logs.got[el.dataset.file]) return;
      const box = el.querySelector(".w-body");
      try {
        const res = await fetch(`/api/stream-logs/${encodeURIComponent(logs.character)}/${encodeURIComponent(el.dataset.file)}`);
        if (!res.ok) throw new Error(res.status);
        logs.got[el.dataset.file] = true;
        box.innerHTML = runHtml(await res.json());
      } catch (err) { box.innerHTML = `<div class="p-empty">読み込めませんでした</div>`; }
    }, true);
    $("gList").addEventListener("click", e => {
      const b = e.target.closest("[data-open]");
      if (!b) return;
      const shut = b.previousElementSibling.classList.toggle("g-clamp");
      b.textContent = shut ? "ぜんぶ見る ↓" : "たたむ ↑";
    });
    function setView(v) {
      document.querySelectorAll("[data-view]").forEach(b => { const on = b.dataset.view === v; b.classList.toggle("is-on", on); b.setAttribute("aria-pressed", on); });
      document.querySelectorAll("[data-view-box]").forEach(x => { x.hidden = x.dataset.viewBox !== v; });
      if (v === "words" && !words.loaded) loadWords("");
      if (v === "logs" && !logs.loaded) loadLogChars();
      if (v === "costs" && !$("cFrame").src) $("cFrame").src = "/costs?embed=1";   // 💰 おかね は、ひみつ の中のタブに(2026-11-19)
      try { history.replaceState(null, "", v === "mail" ? location.pathname + location.search : "#" + v); } catch (e) {}
    }
    $("views").addEventListener("click", e => { const b = e.target.closest("[data-view]"); if (b) setView(b.dataset.view); });
    // おかねの高さを中身に合わせる(同じ家のページなので読める)
    $("cFrame").addEventListener("load", () => {
      const f = $("cFrame");
      const fit = () => { try { f.style.height = f.contentDocument.documentElement.scrollHeight + "px"; } catch (e) {} };
      fit(); setTimeout(fit, 400); setTimeout(fit, 1500);
    });
    if (["#words", "#logs", "#costs"].includes(location.hash)) setView(location.hash.slice(1));
    // 行動ログ・おかねを見せないことになっている人には、粒を出さない(開いていたら手紙へ戻す)
    fetch("/api/me").then(r => r.json()).then(me => {
      for (const id of ["logs", "costs"]) {
        if (!(me.hide_tools || []).includes(id)) continue;
        const b = document.querySelector(`[data-view="${id}"]`);
        if (b.classList.contains("is-on")) setView("mail");
        b.hidden = true;
      }
    }).catch(() => {});
    load(true);
  </script>
</body>
</html>
