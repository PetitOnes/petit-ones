name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONNOUSERSITE: "1"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: ruff check (ruff.toml + 部品ごとの pyproject)
        run: uvx ruff@0.17.0 check .

  test:
    name: pytest ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 部品(src/m5-petit-*)はそれぞれのリポの CI で確かめる。ここはこのリポにあるものだけ
        dir:
          - experience-daemon
          - slack-approve
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: 依存(dev 含む)
        run: uv sync --all-extras
      - name: pytest
        run: uv run pytest -q

  test-scripts:
    name: pytest scripts/tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv run --with pytest pytest -q scripts/tests

  yaml:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx yamllint -c .yamllint .

  shell-json:
    name: bash -n / json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: シェルの文法
        run: |
          set -e
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - name: JSON が読めるか
        run: |
          set -e
          for f in $(git ls-files '*.json'); do python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; done

  naming:
    name: branch / PR title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: branch 名(Conventional Branch)
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if ! echo "$BRANCH" | grep -Eq '^(feat|feature|fix|bugfix|hotfix|release|chore|docs|refactor|test|ci|ai|claude|codex|copilot|cursor)/[a-z0-9]+([.-][a-z0-9]+)*$'; then
            echo "::error::branch 名 '$BRANCH' が規則に合いません。<type>/<小文字-ハイフン> の形に(CONTRIBUTING.md)"
            exit 1
          fi
      - name: PR の題(Conventional Commits)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITLE" | grep -Eq '^(feat|fix|docs|chore|refactor|test|ci|perf|build|style|revert)(\([a-z0-9._/-]+\))?!?: .+'; then
            echo "::error::PR の題 '$TITLE' が規則に合いません。'feat(scope): 何をしたか' の形に(CONTRIBUTING.md)"
            exit 1
          fi
