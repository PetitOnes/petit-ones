name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONNOUSERSITE: "1"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: ruff check (ruff.toml + 部品ごとの pyproject)
        run: uvx ruff@0.17.0 check .

  test:
    name: pytest ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - src/m5-petit-memory
          - src/m5-petit-desire
          - src/m5-petit-notes
          - src/m5-petit-relations
          - src/m5-petit-app
          - experience-daemon
          - slack-approve
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: 依存(dev 含む)
        run: uv sync --all-extras
      - name: pytest
        run: uv run pytest -q

  test-scripts:
    name: pytest scripts/tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv run --with pytest pytest -q scripts/tests

  yaml:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx yamllint -c .yamllint .

  shell-json:
    name: bash -n / json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: シェルの文法
        run: |
          set -e
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - name: JSON が読めるか
        run: |
          set -e
          for f in $(git ls-files '*.json'); do python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; done
