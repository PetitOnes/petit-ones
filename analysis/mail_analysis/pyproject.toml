[project]
name = "mail-analysis"
version = "0.1.0"
description = "RQ1: 第三の子の誕生による関係再編 — ぷちたちメールコーパスの週次分析"
requires-python = ">=3.10"
dependencies = [
    "janome>=0.5.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
mail-parse = "parse_mailbox:main"
mail-aggregate = "aggregate:main"
mail-figures = "figures:main"
mail-topics = "topics:main"
mail-topics-dyad = "topics:main_dyad"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["parse_mailbox.py", "aggregate.py", "figures.py", "topics.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
