# petit-ones 全体の ruff 設定(部品ごとの pyproject.toml に [tool.ruff] があればそちらが優先)
line-length = 120
target-version = "py310"
extend-exclude = [
  "src",        # 部品リポの clone(petit.repos で並べる。lint はそれぞれのリポで)
  "next", "tmp", "node_modules", ".venv",
]

[lint]
select = ["E", "F", "I", "W"]
# E501 行の長さ / E401・E402 import の並び / E701・E702 一行に複数文 / E741 変数名 l は、古い大きなファイル(dashboard など)に多いので見ない
ignore = ["E501", "E401", "E402", "E701", "E702", "E741"]
