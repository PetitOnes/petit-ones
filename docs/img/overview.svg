<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="'Hiragino Sans','Noto Sans JP','Segoe UI',sans-serif">
  <rect width="960" height="420" rx="18" fill="#FFFDF8"/>
  <text x="40" y="36" font-size="14" fill="#6E625A">ろーかるぷち(頭脳が自分の PC にいる版)</text>
  <!-- 体 -->
  <rect x="40" y="70" width="230" height="180" rx="16" fill="#D2E7E4" stroke="#2E837B" stroke-width="2"/>
  <text x="155" y="105" text-anchor="middle" font-size="22" font-weight="700" fill="#20655E">体</text>
  <text x="155" y="130" text-anchor="middle" font-size="13" fill="#3A322D">M5Stack CoreS3</text>
  <text x="155" y="165" text-anchor="middle" font-size="13" fill="#3A322D">顔・声・カメラ</text>
  <text x="155" y="186" text-anchor="middle" font-size="13" fill="#3A322D">タッチ・動き・明るさ</text>
  <text x="155" y="225" text-anchor="middle" font-size="12" fill="#6E625A">m5-petit-firmware</text>
  <!-- 頭脳 -->
  <rect x="365" y="40" width="230" height="240" rx="16" fill="#F6D8CF" stroke="#E0674C" stroke-width="2"/>
  <text x="480" y="75" text-anchor="middle" font-size="22" font-weight="700" fill="#B84E33">頭脳</text>
  <text x="480" y="100" text-anchor="middle" font-size="13" fill="#3A322D">Claude Code + MCP</text>
  <text x="480" y="135" text-anchor="middle" font-size="13" fill="#3A322D">30 分ごとに目を覚まし</text>
  <text x="480" y="156" text-anchor="middle" font-size="13" fill="#3A322D">見て・感じて・考えて・話す</text>
  <text x="480" y="195" text-anchor="middle" font-size="12" fill="#6E625A">autonomous-action.sh</text>
  <text x="480" y="214" text-anchor="middle" font-size="12" fill="#6E625A">欲求 ・ 記憶 ・ ノート ・ 関係</text>
  <text x="480" y="250" text-anchor="middle" font-size="12" fill="#6E625A">m5-petit-mcp / -memory / -desire …</text>
  <!-- 家 -->
  <rect x="690" y="70" width="230" height="180" rx="16" fill="#F6EFE2" stroke="#6E625A" stroke-width="2"/>
  <text x="805" y="105" text-anchor="middle" font-size="22" font-weight="700" fill="#3A322D">家</text>
  <text x="805" y="130" text-anchor="middle" font-size="13" fill="#3A322D">PETIT_DATA_DIR</text>
  <text x="805" y="165" text-anchor="middle" font-size="13" fill="#3A322D">SOUL.md ・ 日記 ・ 記憶 DB</text>
  <text x="805" y="186" text-anchor="middle" font-size="13" fill="#3A322D">手紙 ・ 交換ノート ・ 設定</text>
  <text x="805" y="225" text-anchor="middle" font-size="12" fill="#6E625A">git に入れない</text>
  <!-- arrows -->
  <g stroke="#3A322D" stroke-width="2.5" fill="none" marker-end="url(#a)" marker-start="url(#b)">
    <line x1="275" y1="160" x2="360" y2="160"/>
    <line x1="600" y1="160" x2="685" y2="160"/>
  </g>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A322D"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3A322D"/></marker>
  </defs>
  <text x="317" y="148" text-anchor="middle" font-size="12" fill="#6E625A">Wi-Fi</text>
  <text x="642" y="148" text-anchor="middle" font-size="12" fill="#6E625A">読む・書く</text>
  <!-- 人 -->
  <text x="480" y="330" text-anchor="middle" font-size="15" fill="#3A322D">一緒に暮らす人 ── ダッシュボードと声で話す ── 教科書が決まりごと(petit-textbook)</text>
  <!-- band -->
  <rect x="40" y="380" width="293" height="10" rx="5" fill="#CAB8D9"/>
  <rect x="333" y="380" width="293" height="10" fill="#00AFCC"/>
  <rect x="626" y="380" width="294" height="10" rx="5" fill="#FFF262"/>
</svg>
